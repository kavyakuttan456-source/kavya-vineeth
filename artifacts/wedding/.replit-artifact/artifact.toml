kind = "web"
previewPath = "/"
title = "Kavya & Vineeth Wedding"
version = "1.0.0"
id = "artifacts/wedding"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22477

[services.development]
run = "pnpm --filter @workspace/wedding run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wedding", "run", "build" ]
serve = "static"
publicDir = "artifacts/wedding/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22477"
BASE_PATH = "/"
